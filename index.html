
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .container {
            max-width: 800px;
            min-height: 100vh;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center">

    <div class="container mx-auto p-6 flex flex-col items-center justify-center">
        <div class="bg-white rounded-xl shadow-lg p-8 w-full">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Gemini API Demo</h1>
            <p class="text-center text-gray-500 mb-8">Enter a prompt and get a response from the Gemini model.</p>

            <!-- Input area for the prompt -->
            <div class="mb-6">
                <label for="prompt-input" class="block text-gray-700 font-medium mb-2">Your Prompt</label>
                <textarea id="prompt-input" rows="4"
                    class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200"
                    placeholder="e.g., Explain quantum computing in simple terms."></textarea>
            </div>

            <!-- Action buttons -->
            <div class="flex justify-center mb-6">
                <button id="send-button"
                    class="bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                    Get Response
                </button>
            </div>

            <!-- Loading indicator -->
            <div id="loading-indicator" class="text-center text-gray-500 hidden mb-6">
                <svg class="animate-spin h-6 w-6 text-blue-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <p class="mt-2">Generating response...</p>
            </div>

            <!-- Output area for the response -->
            <div id="response-container" class="mt-8">
                <div id="response-output"
                    class="bg-gray-50 p-6 rounded-lg border border-gray-200 min-h-[100px] overflow-auto text-gray-700">
                    <p class="text-gray-400 italic">Your response will appear here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendButton = document.getElementById('send-button');
            const promptInput = document.getElementById('prompt-input');
            const responseOutput = document.getElementById('response-output');
            const loadingIndicator = document.getElementById('loading-indicator');

            sendButton.addEventListener('click', () => {
                const prompt = promptInput.value.trim();
                if (prompt) {
                    getGeminiResponse(prompt);
                } else {
                    responseOutput.innerHTML = '<p class="text-red-500">Please enter a prompt.</p>';
                }
            });

            async function getGeminiResponse(userPrompt) {
                // Show loading indicator and clear previous response
                loadingIndicator.classList.remove('hidden');
                responseOutput.innerHTML = '';
                
                // Use the new local API route
                const apiUrl = '/api/gemini';

                const payload = {
                    prompt: userPrompt
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`API Error: ${response.status} - ${errorData.error}`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0) {
                        const text = result.candidates[0].content.parts[0].text;
                        responseOutput.innerHTML = `<pre class="whitespace-pre-wrap">${text}</pre>`;
                    } else {
                        throw new Error("Received an empty or invalid response from the API.");
                    }

                } catch (error) {
                    console.error('An error occurred:', error);
                    responseOutput.innerHTML = `<p class="text-red-500">An error occurred: ${error.message}</p>`;
                } finally {
                    loadingIndicator.classList.add('hidden');
                }
            }
        });
    </script>
</body>

</html>
