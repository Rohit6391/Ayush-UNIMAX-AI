
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Unimax AI Studio - Offline Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-headline { font-family: 'Space Grotesk', sans-serif; }
        .dark {
            --background: hsl(220, 15%, 15%);
            --foreground: hsl(210, 40%, 98%);
            --card: hsl(220, 15%, 20%);
            --card-foreground: hsl(210, 40%, 98%);
            --primary: hsl(220, 53%, 47%);
            --primary-foreground: hsl(210, 40%, 98%);
            --secondary: hsl(217.2, 32.6%, 17.5%);
            --secondary-foreground: hsl(210, 40%, 98%);
            --muted: hsl(217.2, 32.6%, 17.5%);
            --muted-foreground: hsl(215, 20.2%, 65.1%);
            --border: hsl(217.2, 32.6%, 17.5%);
            --input: hsl(217.2, 32.6%, 17.5%);
        }
        body { background-color: var(--secondary); color: var(--foreground); }
        .sidebar { background-color: var(--card); }
        .main-content { background-color: var(--background); }
        .card { background-color: var(--card); border-color: var(--border); }
        .header { background-color: hsla(var(--card), 0.8); backdrop-filter: blur(4px); border-color: hsla(var(--border), 0.5); }
        .mode-card { background-color: var(--card); }
        .mode-icon-bg { background-color: hsla(var(--primary), 0.1); }
        .mode-icon-text { color: var(--primary); }
        .btn-primary { background-color: var(--primary); color: var(--primary-foreground); }
        .btn-ghost { color: var(--muted-foreground); }
        .btn-ghost:hover { background-color: var(--muted); }
        .input { background-color: var(--input); border-color: var(--border); }
        .textarea { background-color: var(--input); border-color: var(--border); }
        .sidebar-menu-button[data-active="true"] { background-color: var(--primary); color: var(--primary-foreground); }
        .sidebar-menu-button:hover { background-color: var(--muted); }
        #ai-notice { display: none; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        const modes = [
            { id: 'chat', name: 'AI Chat', icon: 'brain-circuit', description: 'Your AI command center for text and files.' },
            { id: 'fun_chat', name: 'Fun Chat', icon: 'bot', description: 'Chat with a more creative and playful AI.' },
            { id: 'photo_generator', name: 'Photo Generator', icon: 'image', description: 'Create stunning images from text prompts.' },
            { id: 'website_maker', name: 'Website Maker', icon: 'globe', description: 'Generate, preview, and import websites.' },
            { id: 'song_writer', name: 'Song Writer', icon: 'music', description: 'Generate lyrics and a matching melody.'},
            { id: 'code_generator', name: 'Code Generator', icon: 'code', description: 'Generate, manage, and import code.'},
            { id: 'video_generator', name: 'Video Storyboard', icon: 'video', description: 'Generate a video storyboard with narration.' },
            { id: 'translator', name: 'Translator', icon: 'languages', description: 'Translate text between multiple languages.'}
        ];
    </script>
</head>
<body class="dark">

<div class="flex h-screen w-full font-sans">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar hidden md:flex flex-col w-64 border-r border-border">
        <div class="p-2">
            <div class="flex items-center gap-2 p-2">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8 mode-icon-text"><path d="M12 2a10 10 0 1 0 10 10c0-4.42-2.87-8.17-6.84-9.5c.52-1.12.38-2.5-.4-3.5c-1.18-1.41-3.14-1.54-4.56-.34c-1.42 1.2-1.54 3.13-.34 4.56c.8.96 2.08 1.28 3.2 1.15A10.02 10.02 0 0 0 12 2Z"></path><path d="M12 12a10 10 0 0 0-4.06 7.94c.54.16 1.08.26 1.63.26c3.13 0 5.8-2.1 6.37-5c.34-.02.67-.06 1-.12A10 10 0 0 0 12 12Z"></path><path d="M18.87 4.14a10.04 10.04 0 0 0-1.84 9.17c.05.26.1.52.16.78c.45-.63.85-1.3 1.2-2c.45-.9 1.1-2.13 1.1-3.35c0-1.29-.6-2.42-1.62-3.6z"></path></svg>
                 <span class="font-bold font-headline text-xl">Ayush Unimax AI</span>
            </div>
        </div>
        <div class="p-2">
            <div class="relative">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-2.5 top-2.5 h-4 w-4 text-muted-foreground"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                <input class="input w-full rounded-lg pl-8" placeholder="Search modes..." type="search">
            </div>
        </div>
        <nav id="sidebar-nav" class="flex-1 p-2 space-y-1 overflow-y-auto">
            <!-- Mode buttons will be inserted here by JS -->
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col flex-1 relative h-screen">
        <header class="header flex items-center justify-between p-4 border-b h-16 shrink-0">
            <h1 id="header-title" class="text-xl md:text-2xl font-headline font-bold">AI Chat</h1>
            <div class="flex items-center gap-2">
                <button class="btn-ghost p-2 rounded-md"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12 21a9 9 0 1 0-9-9c0 1.48.5 2.84 1.3 4l-1.3 4Z"></path><path d="M22 22a8 8 0 0 0-8-8"></path><path d="M18 18a3 3_0 0 0-3-3"></path></svg></button>
                <button class="btn-ghost p-2 rounded-md"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0 2l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2-0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                <button class="btn-ghost p-2 rounded-md"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></button>
                <button class="btn-primary px-4 py-2 rounded-md">Sign In</button>
            </div>
        </header>

        <main id="main-content-area" class="flex-1 overflow-y-auto main-content">
             <!-- Mode content will be inserted here by JS -->
        </main>
        <div id="ai-notice" class="fixed bottom-5 right-5 bg-red-800 text-white p-4 rounded-lg shadow-lg max-w-sm">
            <h3 class="font-bold">Functionality Disabled</h3>
            <p>This is a static HTML file. AI generation and other interactive features require an internet connection and are disabled in this offline version.</p>
        </div>
    </div>
</div>

<script>
    const icons = {
        'brain-circuit': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10c0-4.42-2.87-8.17-6.84-9.5c.52-1.12.38-2.5-.4-3.5c-1.18-1.41-3.14-1.54-4.56-.34c-1.42 1.2-1.54 3.13-.34 4.56c.8.96 2.08 1.28 3.2 1.15A10.02 10.02 0 0 0 12 2Z"></path><path d="M12 12a10 10 0 0 0-4.06 7.94c.54.16 1.08.26 1.63.26c3.13 0 5.8-2.1 6.37-5c.34-.02.67-.06 1-.12A10 10 0 0 0 12 12Z"></path><path d="M18.87 4.14a10.04 10.04 0 0 0-1.84 9.17c.05.26.1.52.16.78c.45-.63.85-1.3 1.2-2c.45-.9 1.1-2.13 1.1-3.35c0-1.29-.6-2.42-1.62-3.6z"></path></svg>',
        'bot': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>',
        'image': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>',
        'globe': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>',
        'music': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>',
        'code': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
        'video': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"></path><rect width="14" height="12" x="2" y="6" rx="2" ry="2"></rect></svg>',
        'languages': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>'
    };

    function showNotice() {
        const notice = document.getElementById('ai-notice');
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 5000);
    }
    
    function renderMode(mode) {
        const mainContent = document.getElementById('main-content-area');
        const headerTitle = document.getElementById('header-title');
        headerTitle.textContent = mode.name;

        mainContent.innerHTML = `
        <div class="flex flex-col items-center justify-start h-full text-center p-4 md:p-8">
            <div class="w-full max-w-4xl">
                <div class="card shadow-lg">
                    <div class="flex flex-col sm:flex-row items-center gap-4 text-left p-6">
                        <div class="p-3 mode-icon-bg rounded-full flex-shrink-0">
                            <div class="h-8 w-8 mode-icon-text">${icons[mode.icon] || icons['brain-circuit']}</div>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold font-headline">${mode.name}</h2>
                            <p class="text-md text-gray-400">${mode.description}</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <textarea placeholder="Prompt functionality is disabled in this offline version." class="textarea w-full rounded-lg p-3 resize-none" rows="4"></textarea>
                        <button class="btn-primary w-full mt-4 py-2 rounded-md">Generate (Disabled)</button>
                    </div>
                </div>
            </div>
        </div>
        `;
        mainContent.querySelector('button').addEventListener('click', showNotice);
    }

    function setupSidebar() {
        const nav = document.getElementById('sidebar-nav');
        modes.forEach(mode => {
            const button = document.createElement('button');
            button.className = 'sidebar-menu-button flex items-center w-full text-left gap-2 p-2 rounded-md';
            button.innerHTML = `<div class="h-5 w-5">${icons[mode.icon] || icons['brain-circuit']}</div><span>${mode.name}</span>`;
            button.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-menu-button').forEach(btn => btn.setAttribute('data-active', 'false'));
                button.setAttribute('data-active', 'true');
                renderMode(mode);
            });
            nav.appendChild(button);
        });

        const firstButton = nav.querySelector('button');
        if (firstButton) {
            firstButton.setAttribute('data-active', 'true');
            renderMode(modes[0]);
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        setupSidebar();
    });
</script>
</body>
</html>
